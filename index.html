<div v-if="showShareModal" class="fixed inset-0 bg-black/98 z-[100] flex flex-col p-4 overflow-y-auto" @click.self="showShareModal = false">
    <div class="w-full max-w-md mx-auto mt-4 mb-20">
        
        <div class="bg-emerald-900/20 p-4 rounded-2xl mb-4 flex gap-4 items-center justify-center border border-emerald-500/30">
            <label class="flex items-center gap-2 text-[13px] font-black cursor-pointer text-emerald-400">
                <input type="checkbox" v-model="shareOptions.showList" class="w-5 h-5 accent-emerald-500"> 顯示清單
            </label>
            <label class="flex items-center gap-2 text-[13px] font-black cursor-pointer text-emerald-400">
                <input type="checkbox" v-model="shareOptions.showNote" class="w-5 h-5 accent-emerald-500"> 顯示附註
            </label>
        </div>

        <div id="capture-zone" class="bg-[#121212] p-8 rounded-[2.5rem] border border-gray-800 mb-6 shadow-2xl">
            <div class="flex justify-between items-start mb-8 pb-6 border-b border-white/10">
                <div>
                    <h2 class="font-black text-emerald-500 text-2xl tracking-tighter">{{ eventName || '數神結算' }}</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase">{{ new Date().toLocaleDateString() }}</p>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-gray-500 font-bold uppercase">總額</div>
                    <div class="font-mono font-black text-emerald-400 text-xl">HKD ${{ totalSpent.toFixed(1) }}</div>
                </div>
            </div>

            <div class="space-y-4 mb-8">
                <div v-for="(s, i) in settlements" :key="i" class="bg-white/[0.03] flex items-center justify-between p-5 rounded-2xl border border-white/5 shadow-inner">
                    <div class="flex items-center gap-3 font-black text-[13px]">
                        <span class="text-rose-400">{{ s.from }}</span>
                        <i class="fas fa-arrow-right text-gray-700 text-[10px]"></i>
                        <span class="text-emerald-500">{{ s.to }}</span>
                    </div>
                    <span class="font-mono text-xl text-emerald-400 font-black italic">HKD ${{ s.amount.toFixed(1) }}</span>
                </div>
            </div>

            <div v-if="shareOptions.showList && expenses.length > 0" class="mt-8 pt-6 border-t border-white/10 space-y-3">
                <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2 italic underline decoration-emerald-500/50">📋 消費紀錄明細</h3>
                <div v-for="exp in expenses" :key="exp.id" class="flex justify-between text-[11px] pb-2 border-b border-white/5 last:border-0">
                    <div class="flex-1">
                        <span class="text-gray-300 font-bold">{{ exp.item }}</span>
                        <span class="text-gray-600 text-[9px] ml-1">({{ exp.payer }}付)</span>
                    </div>
                    <span class="font-mono text-emerald-500 font-black">${{ exp.hkd.toFixed(1) }}</span>
                </div>
            </div>

            <div v-if="shareOptions.showNote" class="mt-8 p-4 bg-emerald-500/5 rounded-2xl border border-emerald-400/20 text-center">
                <p class="text-[12px] text-emerald-300 italic font-black">
                    「大家對對佢，冇問題就跟上面轉帳啦！」
                </p>
            </div>

            <div class="mt-10 pt-6 text-center opacity-10">
                <span class="text-[8px] font-black tracking-[0.4em] uppercase">Powered by MathGod</span>
            </div>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <button @click="copyText" class="bg-gray-800 py-5 rounded-2xl text-xs font-black text-white shadow-xl active:bg-gray-700">複製文字</button>
            <button @click="generateImage" class="bg-emerald-600 py-5 rounded-2xl text-xs font-black text-white shadow-xl active:bg-emerald-500">下載圖片</button>
        </div>
        
        <button @click="showShareModal = false" class="w-full mt-6 text-gray-500 font-black text-xs p-4">返回主頁</button>
    </div>
</div>
